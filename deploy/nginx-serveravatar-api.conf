# Add inside the ServerAvatar Nginx server {} block for tulusy.cc
# (via ServerAvatar -> Application -> Nginx Settings / Custom Rules, or an included .conf file)

# Allow up to 100 MiB converter uploads (use 5G only if local hosting fallback is used instead of R2)
client_max_body_size 110M;

# Route all /api/* requests directly to FastAPI/Uvicorn instead of bouncing through Next.js
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow large file streaming and long PDF/DOCX/PPTX conversion jobs
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;
}
